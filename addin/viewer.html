<!doctype html>
<html><head><meta charset="utf-8"><title>AxPyMOL Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="axpymol-token" content="__AXPYMOL_TOKEN__">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
 :root{color-scheme:light dark;font-family:-apple-system,system-ui,sans-serif}
 html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ddd;font-size:12px}
 #stage{position:fixed;inset:0}
 canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
 #bar{position:fixed;left:6px;right:6px;bottom:6px;display:flex;gap:6px;align-items:center;
   opacity:0;transition:opacity .15s} body:hover #bar,#bar:focus-within{opacity:1}
 #bar>*{background:#222c;color:#eee;border:1px solid #555;border-radius:4px;padding:3px 6px;font-size:12px}
 #cmd{flex:1;min-width:0}
 #msg{position:fixed;top:6px;left:8px;color:#aaa}
 #pick{position:fixed;inset:0;background:#111;padding:16px;overflow:auto;display:none}
 #pick button,#pick select{font-size:13px;padding:6px;margin:4px 0;display:block;width:100%}
</style></head><body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="msg">Starting…</div>
<div id="bar">
  <button id="reset" title="Reset view (or double-click)">Reset</button>
  <select id="scenes" title="PyMOL scenes"></select>
  <input id="cmd" placeholder="PyMOL command, Enter to run" spellcheck="false">
  <label title="Ray-trace when you stop dragging"><input type="checkbox" id="ray"> ray</label>
  <button id="change" title="Choose another scene">⋯</button>
</div>
<div id="pick">
  <h3>AxPyMOL scene</h3>
  <select id="existing" size="6"></select>
  <button id="use">Use selected scene</button>
  <button id="upfile">Upload .pml / .pse / structure…</button>
  <button id="updir">Upload scene folder…</button>
  <input type="file" id="file" multiple hidden><input type="file" id="dir" webkitdirectory hidden>
  <div id="pmsg"></div>
</div>
<script src="viewer.js"></script>
</body></html>
